name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: 1. Typecheck (宪法 V: TS strict)
        run: npm run typecheck
      - name: 2. Lint (0 warnings)
        run: npm run lint
      - name: 3. Unit + Integration tests
        run: npm test
        env:
          USE_IN_MEMORY_STORE: "true"
      - name: 4. Build (bundle check)
        run: npm run build
      - name: 5. Playwright E2E
        run: npm run test:e2e
      - name: 6. Storybook + axe-core a11y (宪法 IV)
        run: npm run storybook:test
